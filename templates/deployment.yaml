apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test222
  template:
    metadata:
      labels:
        app: test222
    spec:
      containers:
        - name: docker image
          image: oluwaseun7/dmailer:latest22
          imagePullPolicy: Always
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"          
          ports:
            - containerPort: 3001
